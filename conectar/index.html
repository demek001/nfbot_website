<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>
  // Captura o token do link (fragment; ?t= só no link "Abrir no Chrome" do Android)
  // e limpa a URL antes de qualquer script ler location.href.
  window.__t = (location.hash.match(/[#&]t=([^&]+)/) || [])[1] ||
               (location.search.match(/[?&]t=([^&]+)/) || [])[1] || "";
  if (window.__t) history.replaceState(null, "", location.pathname);
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Notinha — Conectar Google Drive</title>
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<link rel="apple-touch-icon" href="../notinha-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=DM+Sans:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0d1117; --surface:#161b22; --border:#30363d;
    --brand:#288A89; --brand-hover:#2EA09E; --brand-soft:#288A8922;
    --text:#e6edf3; --muted:#8b949e; --accent:#f0f6fc; --danger:#f85149;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:var(--bg); color:var(--text);
    font-family:'DM Sans',sans-serif; font-weight:300; line-height:1.65; min-height:100vh;
  }
  body::before {
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(800px circle at 20% 0%, rgba(40,138,137,0.08), transparent 40%),
      radial-gradient(600px circle at 80% 30%, rgba(40,138,137,0.05), transparent 50%);
  }
  .wrap { max-width:560px; margin:0 auto; padding:0 24px; position:relative; z-index:1; }
  header { padding:20px 0; border-bottom:1px solid var(--border); }
  header .wrap { max-width:980px; display:flex; justify-content:center; }
  .logo { display:inline-flex; align-items:center; gap:10px; text-decoration:none; }
  .logo img { height:34px; }
  .logo-text { font-family:'Plus Jakarta Sans',sans-serif; font-weight:500; font-size:24px; color:var(--accent); }

  main { padding:64px 0 80px; }
  .box {
    background:var(--surface); border:1px solid var(--brand); border-radius:20px;
    padding:44px 40px; text-align:center;
  }
  .check {
    width:68px; height:68px; margin:0 auto 22px; border-radius:50%;
    background:var(--brand-soft); border:2px solid var(--brand);
    display:flex; align-items:center; justify-content:center;
    color:var(--brand); font-size:34px; font-weight:700;
  }
  .check.err { color:var(--danger); border-color:var(--danger); background:#f8514922; }
  h1 { font-family:'Fraunces',serif; font-weight:600; font-size:28px; color:var(--accent); margin-bottom:12px; letter-spacing:-0.02em; }
  p { color:var(--muted); font-size:15px; margin-bottom:14px; }
  p b { color:var(--accent); font-weight:500; }
  a.link { color:var(--brand-hover); }
  .cta {
    display:inline-flex; align-items:center; justify-content:center; gap:10px;
    margin-top:10px; padding:16px 32px; background:var(--brand); color:#fff; border:0; cursor:pointer;
    text-decoration:none; font-family:inherit; font-weight:600; font-size:16px; border-radius:100px;
    transition:background .2s, transform .2s;
  }
  .cta:hover { background:var(--brand-hover); transform:translateY(-1px); }
  .cta.sec { background:transparent; border:1px solid var(--border); color:var(--accent); }
  .acoes { display:flex; flex-direction:column; align-items:center; gap:6px; margin-top:8px; }
  .passos { text-align:left; margin:18px 0 6px; padding-left:20px; color:var(--muted); font-size:15px; }
  .passos li { margin-bottom:6px; }
  .nota { font-size:13px; margin-top:20px; }
  .ok { color:var(--brand-hover); font-size:14px; min-height:20px; margin-top:8px; }

  footer { padding:32px 0; border-top:1px solid var(--border); color:var(--muted); font-size:13px; text-align:center; }
  footer a { color:var(--muted); text-decoration:none; margin:0 10px; }
  footer a:hover { color:var(--brand); }
  .legal { margin-top:14px; }
  @media (max-width:560px){ .box{ padding:32px 20px; } h1{ font-size:24px; } }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a href="../index.html" class="logo">
      <img src="../notinha-icon.png" alt="Notinha">
      <span class="logo-text">Notinha<sup style="font-size:0.45em; font-weight:400; vertical-align:top; margin-left:1px;">™</sup></span>
    </a>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="box" id="box"><h1>Carregando…</h1><p>Só um instante.</p></div>
  </div>
</main>

<footer>
  <div class="wrap" style="max-width:980px;">
    <a href="../privacidade.html">Política de Privacidade</a>
    <a href="../termos.html">Termos de Uso</a>
    <a href="../contato/">Contato</a>
    <div class="legal">© 2026 Notinha · CNPJ 66.824.150/0001-28</div>
  </div>
</footer>

<script>
  const URL_FN = "https://xpzjwlhrlebdpcybxaxu.supabase.co/functions/v1/conectar-drive";
  const box = document.getElementById("box");
  const token = window.__t;
  const ua = navigator.userAgent || "";
  // Mesma lista da função conectar-drive. O Google não deixa conectar dentro desses apps.
  const EMBUTIDO = /FBAN|FBAV|FB_IAB|FB4A|FBIOS|Instagram|WhatsApp|Line\/|LinkedInApp|Snapchat|TikTok|musical_ly|BytedanceWebview|Twitter|; wv\)/i;
  const embutido = EMBUTIDO.test(ua);
  const android = /Android/i.test(ua);

  function esc(v) {
    return String(v).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function expirado() {
    box.innerHTML =
      '<div class="check err">!</div>' +
      '<h1>Este link expirou</h1>' +
      '<p>Fale com a gente em <a class="link" href="../contato/">usenotinha.com.br/contato</a> e enviamos um novo.</p>';
  }

  function jaConectado(nome) {
    box.innerHTML =
      '<div class="check">&#10003;</div>' +
      '<h1>Seu Google Drive já está conectado</h1>' +
      '<p>' + (nome ? esc(nome) + ', não' : 'Não') + ' precisa fazer mais nada por aqui. ' +
      'É só mandar a foto ou o PDF da sua nota no WhatsApp do Notinha.</p>';
  }

  function abrirNoNavegador(nome) {
    const link = "https://usenotinha.com.br/conectar/#t=" + token;
    const intent = "intent://usenotinha.com.br/conectar/?t=" + encodeURIComponent(token) +
      "#Intent;scheme=https;package=com.android.chrome;end";
    box.innerHTML =
      '<h1>Abra no ' + (android ? 'Chrome' : 'Safari ou no Chrome') + '</h1>' +
      '<p>' + (nome ? 'Oi, ' + esc(nome) + '! ' : '') +
      'Você abriu este link dentro de um app (WhatsApp, Instagram ou Facebook). ' +
      'Por segurança, o Google só deixa conectar o Drive no navegador do celular.</p>' +
      (android
        ? '<div class="acoes"><a class="cta" href="' + esc(intent) + '">Abrir no Chrome →</a>' +
          '<button class="cta sec" type="button" id="copiar">Copiar link</button></div>'
        : '<ol class="passos"><li>Toque em <b>⋯</b> ou no ícone de compartilhar.</li>' +
          '<li>Escolha <b>Abrir no Safari</b> (ou <b>Abrir no navegador</b>).</li></ol>' +
          '<div class="acoes"><button class="cta sec" type="button" id="copiar">Copiar link</button></div>') +
      '<div class="ok" id="ok" role="status"></div>' +
      '<p class="nota">Se preferir, copie o link e cole no navegador.</p>';
    document.getElementById("copiar").addEventListener("click", function () {
      const ok = document.getElementById("ok");
      const feito = function () { ok.textContent = "Link copiado. Agora cole no Chrome ou no Safari."; };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(link).then(feito, function () { prompt("Copie o link:", link); });
      } else {
        prompt("Copie o link:", link);
      }
    });
  }

  function indoParaGoogle(url) {
    box.innerHTML =
      '<h1>Indo para o Google…</h1>' +
      '<p>Na tela oficial do Google, autorize o Notinha a criar a pasta <b>Notinha</b> no seu Drive. ' +
      'O Notinha só acessa os arquivos que ele mesmo cria nessa pasta.</p>' +
      '<div class="acoes"><a class="cta" href="' + esc(url) + '" rel="noreferrer">Continuar para o Google →</a></div>';
    location.replace(url);
  }

  function falhaTemporaria() {
    box.innerHTML =
      '<div class="check err">!</div>' +
      '<h1>Não deu pra abrir o Google agora</h1>' +
      '<p>Tente de novo em instantes. Se continuar, fale com a gente em ' +
      '<a class="link" href="../contato/">usenotinha.com.br/contato</a>.</p>' +
      '<div class="acoes"><button class="cta" type="button" id="denovo">Tentar de novo</button></div>';
    document.getElementById("denovo").addEventListener("click", iniciar);
  }

  function iniciar() {
    box.innerHTML = '<h1>Carregando…</h1><p>Só um instante.</p>';
    fetch(URL_FN, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ t: token, embutido: embutido }),
    })
      .then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (j) { return { status: r.status, j: j }; });
      })
      .then(function (r) {
        if (r.j && r.j.url) { indoParaGoogle(r.j.url); return; }
        if (r.j && r.j.ja_conectado) { jaConectado(r.j.nome); return; }
        if (r.j && r.j.embutido) { abrirNoNavegador(r.j.nome); return; }
        if (r.status === 401) { expirado(); return; }
        falhaTemporaria();
      })
      .catch(falhaTemporaria);
  }

  if (!token) expirado(); else iniciar();
</script>

</body>
</html>
