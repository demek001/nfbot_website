<!DOCTYPE html>

<head>

<meta name="referrer" content="no-referrer">
<title>Pagamento confirmado | Notinha</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/notinha-icon.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
<script>
window.dataLayer=window.dataLayer||[];
function gtag(){dataLayer.push(arguments);}
gtag('consent','default',{ad_storage:'denied',ad_user_data:'denied',ad_personalization:'denied',analytics_storage:'denied',functionality_storage:'granted',security_storage:'granted',wait_for_update:500});
try{if(localStorage.getItem('cookieConsent')==='all'){gtag('consent','update',{ad_storage:'granted',ad_user_data:'granted',ad_personalization:'granted',analytics_storage:'granted'});}}catch(e){}
</script>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-FC1XHM57Z6"></script>
<script>
gtag('js',new Date());
gtag('set','url_passthrough',true);
gtag('set','ads_data_redaction',true);
gtag('config','G-FC1XHM57Z6',{ignore_referrer:true});
gtag('config','AW-18331471265');
</script>
<style>
:root{--bg:#081211;--surface:#0f1d1b;--ink:#f6f4ee;--muted:#acbab6;--brand:#2aa6a2;--brand2:#73d2cc;--line:#24413d;--ok:#64d8a5}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif;display:grid;place-items:center;padding:24px}.box{width:min(620px,100%);background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:40px;text-align:center;box-shadow:0 26px 80px rgba(0,0,0,.28)}.logo{height:42px;margin-bottom:28px}.icon{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;margin:0 auto 22px;background:rgba(100,216,165,.12);color:var(--ok);font-size:34px;font-weight:800}.eyebrow{color:var(--brand2);font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}h1{font:700 clamp(34px,7vw,52px)/1.03 'Fraunces',serif;margin:12px 0 16px}p{color:var(--muted);font-size:17px;line-height:1.6;margin:0 auto 18px;max-width:500px}.status{font-size:14px;color:var(--muted);margin-top:20px}.cta{display:inline-flex;justify-content:center;align-items:center;margin-top:16px;padding:15px 24px;border-radius:12px;background:var(--brand);color:#fff;text-decoration:none;font-weight:700}.small{font-size:13px;margin-top:24px}@media(max-width:520px){.box{padding:30px 22px}}
</style>
</head>
<body>
<main class="box">
  <a href="/" aria-label="Notinha"><img class="logo" src="/notinha-logo.png" alt="Notinha"></a>
  <div class="icon">✓</div>
  <div class="eyebrow">Pagamento recebido</div>
  <h1>Seu Notinha está sendo liberado.</h1>
  <p>Assim que a confirmação terminar, você recebe por e-mail o código para ativar o Notinha no WhatsApp.</p>
  <p class="status" id="status">Confirmando seu pagamento…</p>
  <a class="cta" href="/" id="voltar">Voltar ao site</a>
  <p class="small">A confirmação financeira continua sendo feita pelo webhook seguro do Asaas.</p>
</main>
<script>
(function(){
  var ENDPOINT='https://xpzjwlhrlebdpcybxaxu.supabase.co/functions/v1/status-conversao';
  var q=new URLSearchParams(location.search), cid=(q.get('cid')||'').trim();
  var status=document.getElementById('status');
  function atrib(){var o={};try{['utm_source','utm_medium','utm_campaign','utm_term','utm_content','gclid','gbraid','wbraid'].forEach(function(k){var v=sessionStorage.getItem('notinha_'+k);if(v)o[k]=v;});}catch(e){}return o;}
  function fire(d){
    var key='notinha_purchase_'+d.transaction_id;
    try{if(localStorage.getItem(key)==='1'){status.textContent='Pagamento confirmado. Confira seu e-mail para ativar o Notinha.';return;}}catch(e){}
    var a=atrib(), item={item_id:d.plano,item_name:d.plano==='premium'?'Premium':'Pleno',price:d.value,quantity:1};
    var payload={transaction_id:d.transaction_id,value:d.value,currency:'BRL',items:[item],plano:d.plano,traffic_source:(a.utm_source||'direto'),ignore_referrer:true};
    Object.keys(a).forEach(function(k){payload[k]=a[k];});
    if(typeof gtag==='function'){
      gtag('event','purchase',payload);
      gtag('event','subscription_purchase',{transaction_id:d.transaction_id,value:d.value,currency:'BRL',plano:d.plano,traffic_source:payload.traffic_source});
    }
    try{localStorage.setItem(key,'1');}catch(e){}
    status.textContent='Pagamento confirmado. Confira seu e-mail para ativar o Notinha.';
  }
  if(!/^[0-9a-f-]{36}$/i.test(cid)){status.textContent='Pagamento concluído. Confira seu e-mail para continuar.';return;}
  var tent=0;
  function verificar(){
    tent++;
    fetch(ENDPOINT+'?cid='+encodeURIComponent(cid),{method:'GET',cache:'no-store'})
      .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
      .then(function(x){
        if(x.ok&&x.j&&x.j.confirmado){fire(x.j);return;}
        if(tent<10){status.textContent='Pagamento recebido. Finalizando a confirmação…';setTimeout(verificar,2000);}else status.textContent='Pagamento recebido. A confirmação pode levar alguns instantes; confira seu e-mail.';
      })
      .catch(function(){if(tent<10)setTimeout(verificar,2000);else status.textContent='Pagamento recebido. Confira seu e-mail para continuar.';});
  }
  verificar();
})();
</script>
</body>
</html>
