<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>
  // Captura o token de renovação do fragment e limpa a URL antes de qualquer
  // script de analytics ler location.href.
  window.__t = (location.hash.match(/[#&]t=([^&]+)/) || [])[1] || "";
  if (window.__t) history.replaceState(null, "", location.pathname);
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Notinha — Continuar com o Notinha</title>
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<link rel="apple-touch-icon" href="../notinha-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=DM+Sans:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0d1117; --surface:#161b22; --border:#30363d;
    --brand:#288A89; --brand-hover:#2EA09E; --brand-soft:#288A8922;
    --text:#e6edf3; --muted:#8b949e; --accent:#f0f6fc; --danger:#f85149;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:var(--bg); color:var(--text);
    font-family:'DM Sans',sans-serif; font-weight:300; line-height:1.65; min-height:100vh;
  }
  body::before {
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(800px circle at 20% 0%, rgba(40,138,137,0.08), transparent 40%),
      radial-gradient(600px circle at 80% 30%, rgba(40,138,137,0.05), transparent 50%);
  }
  .wrap { max-width:560px; margin:0 auto; padding:0 24px; position:relative; z-index:1; }
  header { padding:20px 0; border-bottom:1px solid var(--border); }
  header .wrap { max-width:980px; display:flex; justify-content:center; }
  .logo { display:inline-flex; align-items:center; gap:10px; text-decoration:none; }
  .logo img { height:34px; }
  .logo-text { font-family:'Plus Jakarta Sans',sans-serif; font-weight:500; font-size:24px; color:var(--accent); }

  main { padding:64px 0 80px; }
  .box {
    background:var(--surface); border:1px solid var(--brand); border-radius:20px;
    padding:44px 40px; text-align:center;
  }
  .check {
    width:68px; height:68px; margin:0 auto 22px; border-radius:50%;
    background:var(--brand-soft); border:2px solid var(--brand);
    display:flex; align-items:center; justify-content:center;
    color:var(--brand); font-size:34px; font-weight:700;
  }
  .check.err { color:var(--danger); border-color:var(--danger); background:#f8514922; }
  h1 { font-family:'Fraunces',serif; font-weight:600; font-size:28px; color:var(--accent); margin-bottom:12px; letter-spacing:-0.02em; }
  p { color:var(--muted); font-size:15px; margin-bottom:14px; }
  p b { color:var(--accent); font-weight:500; }
  a.link { color:var(--brand-hover); }
  .cta {
    display:inline-flex; align-items:center; justify-content:center; gap:10px;
    margin-top:10px; padding:16px 32px; background:var(--brand); color:#fff; border:0; cursor:pointer;
    text-decoration:none; font-family:inherit; font-weight:600; font-size:16px; border-radius:100px;
    transition:background .2s, transform .2s;
  }
  .cta:hover { background:var(--brand-hover); transform:translateY(-1px); }
  .cta:disabled { opacity:.6; cursor:wait; transform:none; }

  form { text-align:left; margin-top:24px; }
  .planos { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:22px; }
  .plano { position:relative; display:block; cursor:pointer; }
  .plano input { position:absolute; opacity:0; pointer-events:none; }
  .plano span {
    display:block; padding:16px; border:1px solid var(--border); border-radius:14px;
    background:var(--bg); transition:border-color .2s, background .2s;
  }
  .plano strong { display:block; color:var(--accent); font-weight:600; font-size:16px; }
  .plano em { font-style:normal; color:var(--muted); font-size:14px; }
  .plano input:checked + span { border-color:var(--brand); background:var(--brand-soft); }
  .plano input:focus-visible + span { outline:2px solid var(--brand-hover); outline-offset:2px; }
  label.campo { display:block; color:var(--accent); font-weight:500; font-size:14px; margin-bottom:6px; }
  input[type=text] {
    width:100%; padding:13px 14px; border-radius:10px; border:1px solid var(--border);
    background:var(--bg); color:var(--text); font-family:inherit; font-size:16px;
  }
  input[type=text]:focus { outline:none; border-color:var(--brand); }
  .ajuda { font-size:13px; margin:6px 0 18px; }
  .aceite { display:flex; gap:10px; align-items:flex-start; color:var(--muted); font-size:14px; margin-bottom:8px; }
  .aceite input { margin-top:4px; accent-color:var(--brand); width:16px; height:16px; flex:none; }
  .erro { color:var(--danger); font-size:14px; min-height:22px; margin:8px 0; }
  .acoes { text-align:center; }
  .nota { font-size:13px; text-align:center; margin-top:18px; }

  footer { padding:32px 0; border-top:1px solid var(--border); color:var(--muted); font-size:13px; text-align:center; }
  footer a { color:var(--muted); text-decoration:none; margin:0 10px; }
  footer a:hover { color:var(--brand); }
  .legal { margin-top:14px; }
  @media (max-width:560px){ .box{ padding:32px 20px; } h1{ font-size:24px; } .planos{ grid-template-columns:1fr; } }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a href="../index.html" class="logo">
      <img src="../notinha-icon.png" alt="Notinha">
      <span class="logo-text">Notinha<sup style="font-size:0.45em; font-weight:400; vertical-align:top; margin-left:1px;">™</sup></span>
    </a>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="box" id="box"><h1>Carregando…</h1><p>Só um instante.</p></div>
  </div>
</main>

<footer>
  <div class="wrap" style="max-width:980px;">
    <a href="../privacidade.html">Política de Privacidade</a>
    <a href="../termos.html">Termos de Uso</a>
    <a href="../contato/">Contato</a>
    <div class="legal">© 2026 Notinha · CNPJ 66.824.150/0001-28</div>
  </div>
</footer>

<script>
  const URL_FN = "https://xpzjwlhrlebdpcybxaxu.supabase.co/functions/v1/renovar-cortesia";
  const box = document.getElementById("box");
  const token = window.__t;

  function esc(v) {
    return String(v).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function chamar(corpo) {
    return fetch(URL_FN, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(Object.assign({ token: token }, corpo)),
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) { return { status: r.status, j: j }; });
    });
  }

  function expirado() {
    box.innerHTML =
      '<div class="check err">!</div>' +
      '<h1>Este link expirou</h1>' +
      '<p>Fale com a gente em <a class="link" href="../contato/">usenotinha.com.br/contato</a> e a gente te ajuda a continuar.</p>';
  }

  function jaRenovado() {
    box.innerHTML =
      '<div class="check">&#10003;</div>' +
      '<h1>Tudo certo por aqui</h1>' +
      '<p>Você já escolheu seu plano. Se precisar do link de pagamento de novo, fale com a gente em ' +
      '<a class="link" href="../contato/">usenotinha.com.br/contato</a>.</p>';
  }

  // CPF: 11 dígitos e dígitos verificadores (o servidor confere de novo).
  function cpfValido(v) {
    const d = String(v).replace(/\D/g, "");
    if (d.length !== 11 || /^(\d)\1{10}$/.test(d)) return false;
    for (let n = 9; n <= 10; n++) {
      let soma = 0;
      for (let i = 0; i < n; i++) soma += Number(d[i]) * (n + 1 - i);
      if ((soma * 10) % 11 % 10 !== Number(d[n])) return false;
    }
    return true;
  }

  function mascaraCpf(v) {
    const d = v.replace(/\D/g, "").slice(0, 11);
    return d.replace(/^(\d{3})(\d)/, "$1.$2").replace(/^(\d{3})\.(\d{3})(\d)/, "$1.$2.$3").replace(/\.(\d{3})(\d)/, ".$1-$2");
  }

  const ERROS = {
    cpf_invalido: "Confira o CPF: ele parece não estar certo.",
    plano_invalido: "Escolha um dos planos.",
    aceite_obrigatorio: "Para continuar, aceite os Termos de Uso e a Política de Privacidade.",
    muitas_tentativas: "Muitas tentativas seguidas. Espere alguns minutos e tente de novo.",
    asaas_indisponivel: "O sistema de pagamento não respondeu. Tente de novo em instantes.",
    cobranca_sem_url: "Sua assinatura foi criada, mas o link de pagamento não veio. Fale com a gente em usenotinha.com.br/contato.",
  };

  function formulario(info) {
    const premium = info.plano_atual !== "base";
    box.style.textAlign = "center";
    box.innerHTML =
      '<h1>Continuar com o Notinha</h1>' +
      '<p>Oi, ' + esc(info.nome || "tudo bem") + '! Sua cortesia vai até <b>' + esc(info.cortesia_ate || "—") + '</b>.</p>' +
      '<p>Escolha seu plano. A primeira mensalidade vence em <b>' + esc(info.cortesia_ate || "—") + '</b>, quando a cortesia termina.</p>' +
      '<form id="f" novalidate>' +
        '<div class="planos" role="radiogroup" aria-label="Plano">' +
          '<label class="plano"><input type="radio" name="plano" value="base"' + (premium ? '' : ' checked') + '>' +
            '<span><strong>Pleno</strong><em>R$ 27,90/mês</em></span></label>' +
          '<label class="plano"><input type="radio" name="plano" value="premium"' + (premium ? ' checked' : '') + '>' +
            '<span><strong>Premium</strong><em>R$ 47,90/mês</em></span></label>' +
        '</div>' +
        '<label class="campo" for="cpf">CPF</label>' +
        '<input type="text" id="cpf" inputmode="numeric" autocomplete="off" placeholder="000.000.000-00" maxlength="14">' +
        '<p class="ajuda">O sistema de pagamento (Asaas) exige o CPF. Ele vai só para lá.</p>' +
        '<label class="aceite"><input type="checkbox" id="aceite">' +
          '<span>Li e aceito os <a class="link" href="../termos.html" target="_blank" rel="noopener">Termos de Uso</a> e a ' +
          '<a class="link" href="../privacidade.html" target="_blank" rel="noopener">Política de Privacidade</a>.</span></label>' +
        '<div class="erro" id="erro" role="alert"></div>' +
        '<div class="acoes"><button class="cta" type="submit" id="btn">Ir para o pagamento →</button></div>' +
        '<p class="nota">O pagamento é feito na página segura do Asaas.</p>' +
      '</form>';

    const cpf = document.getElementById("cpf");
    const erro = document.getElementById("erro");
    const btn = document.getElementById("btn");
    cpf.addEventListener("input", function () { cpf.value = mascaraCpf(cpf.value); });

    document.getElementById("f").addEventListener("submit", function (ev) {
      ev.preventDefault();
      erro.textContent = "";
      const plano = (document.querySelector('input[name="plano"]:checked') || {}).value;
      if (!plano) { erro.textContent = ERROS.plano_invalido; return; }
      if (!cpfValido(cpf.value)) { erro.textContent = ERROS.cpf_invalido; cpf.focus(); return; }
      if (!document.getElementById("aceite").checked) { erro.textContent = ERROS.aceite_obrigatorio; return; }

      btn.disabled = true;
      btn.textContent = "Abrindo o pagamento…";
      chamar({ acao: "assinar", cpf: cpf.value.replace(/\D/g, ""), plano: plano, aceite: true })
        .then(function (r) {
          if (r.j && r.j.payment_url) { location.href = r.j.payment_url; return; }
          if (r.status === 409 || (r.j && r.j.ja_renovado)) { jaRenovado(); return; }
          if (r.status === 401) { expirado(); return; }
          erro.textContent = (r.j && (ERROS[r.j.erro] || r.j.mensagem)) || ERROS.asaas_indisponivel;
          btn.disabled = false;
          btn.textContent = "Ir para o pagamento →";
        })
        .catch(function () {
          erro.textContent = ERROS.asaas_indisponivel;
          btn.disabled = false;
          btn.textContent = "Ir para o pagamento →";
        });
    });
  }

  if (!token) {
    expirado();
  } else {
    chamar({ acao: "info" })
      .then(function (r) {
        if (r.status !== 200) { expirado(); return; }
        if (r.j.ja_renovado) { jaRenovado(); return; }
        formulario(r.j);
      })
      .catch(expirado);
  }
</script>

</body>
</html>
