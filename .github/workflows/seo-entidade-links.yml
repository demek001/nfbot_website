name: Corrigir JSON-LD SEO

on:
  push:
    paths:
      - ".github/workflows/seo-entidade-links.yml"

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Corrigir e validar JSON-LD
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          p = Path('index.html')
          t = p.read_text(encoding='utf-8')
          bad = 'automáticos.,"\n      "sameAs"'
          good = 'automáticos.",\n      "sameAs"'
          if bad in t:
              t = t.replace(bad, good, 1)
          p.write_text(t, encoding='utf-8')

          # Valida todos os blocos JSON-LD do site após as mudanças.
          checked = 0
          for html in Path('.').rglob('*.html'):
              text = html.read_text(encoding='utf-8')
              for raw in re.findall(r'<script\s+type="application/ld\+json">(.*?)</script>', text, flags=re.S):
                  json.loads(raw)
                  checked += 1
          print(f'JSON-LD validado: {checked} blocos')
          PY

      - name: Commitar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Nenhuma correcao pendente"
          else
            git commit -m "fix: corrige JSON-LD da entidade Notinha"
            git push
          fi
