name: Remover backend do repositorio publico

on:
  push:
    branches:
      - security/move-backend-private
    paths:
      - ".github/workflows/cleanup-public-backend.yml"

permissions:
  contents: write

jobs:
  limpar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/move-backend-private
          fetch-depth: 0

      - name: Remover backend e workflow antigo
        run: |
          rm -rf supabase
          rm -f .github/workflows/sync-onboarding-attribution.yml
          rm -f .github/workflows/cleanup-public-backend.yml

      - name: Commitar limpeza
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "security: remove backend do repositorio publico"
          git push origin HEAD:security/move-backend-private
