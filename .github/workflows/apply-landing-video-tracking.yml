name: Aplicar landing TikTok e tracking

on:
  push:
    branches:
      - fix/landing-video-tracking-20260914
    paths:
      - ".github/workflows/apply-landing-video-tracking.yml"

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/landing-video-tracking-20260914
      - name: Atualizar landing
        run: python scripts/apply_landing_patch.py
      - name: Validar
        run: |
          grep -F '/Envio-nf_menu_drive.mp4' controle-gastos-whatsapp/index.html
          grep -F '/dashboard-web.mp4' controle-gastos-whatsapp/index.html
          grep -F 'product_demo_video_progress' controle-gastos-whatsapp/index.html
          grep -F 'traffic_source' controle-gastos-whatsapp/index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add controle-gastos-whatsapp/index.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: usa videos finais e amplia tracking da landing"
          git push origin HEAD:fix/landing-video-tracking-20260914
